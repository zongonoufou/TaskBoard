spring.application.name=TaskBoard
server.port=${PORT:8081}

# Désactive la gestion Docker Compose par défaut : l'application doit démarrer
# même si Docker n'est pas installé. Activé uniquement par le profil "docker".
spring.docker.compose.enabled=false

# ============================================================
#  Base de données par défaut : H2 en fichier (aucune installation)
#  Démarrage immédiat :  ./mvnw spring-boot:run
#
#  Autres options :
#   - PostgreSQL local  : ./mvnw spring-boot:run -Dspring-boot.run.profiles=docker
#   - Démo + SQL        : ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# ============================================================
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/taskboard;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Console H2 (dev uniquement) ---
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# ============================================================
#  Sécurité / JWT
#  ⚠️  Surchargez JWT_SECRET en production (clé Base64 >= 32 octets)
# ============================================================
jwt.secret=${JWT_SECRET:a2V5LWZvci1kZXYtb25seS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0yMDI2LXRhc2tib2FyZA==}
# Durée de vie du token en millisecondes (24 h)
jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================================
#  CORS : origines autorisées pour un front séparé (séparées par des virgules)
# ============================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ============================================================
#  Documentation OpenAPI / Swagger
#   UI  : http://localhost:8081/swagger-ui.html
#   JSON: http://localhost:8081/v3/api-docs
# ============================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# ============================================================
#  Journalisation
# ============================================================
logging.level.com.example=${LOG_LEVEL:INFO}
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %cyan(%logger{36}) - %msg%n

# ============================================================
#  Divers
# ============================================================
server.error.include-message=always
spring.jackson.default-property-inclusion=non_null
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100
