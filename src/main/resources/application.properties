spring.application.name=TaskBoard
# --- Désactive le Docker Compose auto de Spring Boot ---
spring.docker.compose.enabled=false

server.port=8080
# --- Connexion PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres18_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=1234


# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
springdoc.swagger-ui.path=/docs

#JWT Configuration
jwt.secret=krw/rif3mEgx0M+QLcU2sdtB9e14o7o2G7iMOr/R+CA=
jwt.expiration=86400000

# 2. Désactiver Open-In-View
spring.jpa.open-in-view=false

# 3. Configurer explicitement SpringDoc pour masquer les WARN de Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true