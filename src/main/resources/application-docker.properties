# ============================================================
#  Profil "docker" : PostgreSQL via docker compose
#  ./mvnw spring-boot:run -Dspring-boot.run.profiles=docker
#
#  Attention : Spring Boot n'accepte QUE docker-compose.yaml / compose.yaml
#  -> on force les propriétés de connexion pour ne pas en dépendre.
# ============================================================
spring.docker.compose.enabled=true
spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.file=compose.yaml
spring.docker.compose.skip.in-tests=true

spring.datasource.url=jdbc:postgresql://localhost:5432/taskboard
spring.datasource.username=taskboard
spring.datasource.password=taskboard
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
